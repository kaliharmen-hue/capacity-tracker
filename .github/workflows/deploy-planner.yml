name: Deploy Personal Planner

on:
  push:
    branches: [personal-planner-prototype]
    paths:
      - 'planner/**'
      - '.github/workflows/deploy-planner.yml'

permissions:
  contents: read

concurrency:
  group: personal-planner-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test and deployment tools
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1 wrangler@4.167.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated regression tests
        run: node --test planner/cloud/session-test.mjs planner/cloud/integration-access-test.mjs planner/cloud/connector-test.mjs planner/cloud/oauth-test.mjs planner/cloud/stage1-test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check planner/app.mjs
          node --check planner/browser-stage1.spec.mjs
      - name: Run Tiimo parser regression test
        run: node integrations/tiimo-extension/parser-test.mjs
      - name: Run Worker integration and Chromium browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory planner >/tmp/planner-http.log 2>&1 &
          static_server=$!
          npx wrangler dev --config planner/cloud/wrangler.toml --ip 127.0.0.1 --port 8794 --var PLANNER_LOCAL_TEST:1 --var PLANNER_OWNER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA >/tmp/planner-worker.log 2>&1 &
          worker_server=$!
          trap 'kill "$static_server" "$worker_server" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1 && static_ready=1 || true
            curl -fsS http://127.0.0.1:8794/ >/dev/null 2>&1 && worker_ready=1 || true
            if [ "${static_ready:-}" = 1 ] && [ "${worker_ready:-}" = 1 ]; then break; fi
            sleep 1
          done
          test "${static_ready:-}" = 1
          test "${worker_ready:-}" = 1
          node --test planner/cloud/integration-test.mjs
          npx playwright test planner/browser-stage1.spec.mjs planner/cloud/worker-stage1.spec.mjs --workers=1 --reporter=list
      - name: Deploy the existing Planner Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          npx wrangler@4.167.0 deploy --config planner/cloud/wrangler.toml
